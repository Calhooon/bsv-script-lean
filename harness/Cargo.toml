path = "src/bin/arith_cases.rs"

[[bin]]
name = "stack_cases"
path = "src/bin/stack_cases.rs"

[[bin]]
name = "ecdsa_vectors"
path = "src/bin/ecdsa_vectors.rs"

[[bin]]
name = "crypto_cases"
path = "src/bin/crypto_cases.rs"

[[bin]]
name = "run_diff"
path = "src/bin/run_diff.rs"

[[bin]]
