# harness/oracle/bitcoin-block.conf: the spec's THIRD SV-node instance, the BLOCK instance (bsv-script-lean #27, D97;
# S3, set 4, 2026-09-26). The same pinned binary and the same idea as bitcoin.conf (mainnet activation heights; a
# private regtest chain no peer ever sees; every policy cap zeroed so the policy path applies the consensus limits,
# Q6), with ONE difference: this instance HAS A CHAIN, built by the harness and never by a peer, because the
# `tx.*` rules (lock time, sequence, the transaction-level gate) need a UTXO set, a block height and a median time
# that `verifyscript` never touches. The chain is mainnet-shaped (the activation heights below are mainnet's, so an
# entry's `params.spend_height` IS the height of the block that carries its spend and a pre-Genesis coin is created
# below 620,538), baked by the `oracle_chain` binary's `bake` command (`harness/src/bin/oracle_chain.rs`, its `bake` arm:
# `generatetoaddress` to the harness's well key in batches, `setmocktime` set once per batch, each block's time the
# node's max(mocktime, MTP + 1)) to a base height and snapshotted (`spec-node.sh block snapshot`); a family's record run restores the
# snapshot, mines its funding transactions at exactly the entries' `prevouts[i].height`, pads to `spend_height - 1`,
# and then assembles and `submitblock`s one block per entry at `spend_height`, invalidating an accepted one so the
# next entry's block sits at the same height. The consensus column (`sv-node@v1.2.3`, mode `block-connect`) is this
# instance's; the policy column (`sendrawtransaction … dontcheckfee` on the policy instance, whose datadir is a copy
# of this one at `spend_height - 1`) is the policy instance's. Started by spec-node.sh with
# `-regtest -conf=<this> -datadir=~/bsv/targets/spec-oracle-block-data -rpcport=18567 -port=18568`.

regtest=1
server=1
listen=0
dnsseed=0
upnp=0
discover=0
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpcthreads=4
rpcworkqueue=64
rpcservertimeout=600

# The eras: mainnet's activation heights (chainparams.cpp:18 GENESIS_ACTIVATION_MAIN 620538, :23
# CHRONICLE_ACTIVATION_MAIN 943816; regtest's own defaults are 10,000 and 15,000, chainparams.cpp:21, 26).
# With these, a block at height h applies the rules the spec assigns to h on mainnet, and a coin created at h is in
# the era the spec assigns to h.
genesisactivationheight=620538
chronicleactivationheight=943816

# THE BAKE'S SPEED: regtest defaults `-checkblockindex` and `-checkmempool` ON (chainparams.cpp:1526
# `fDefaultConsistencyChecks = true`, init.cpp:2204): the whole block index is walked after every block, so a bake
# slows as the chain grows (measured 2026-09-26: 500 blocks/s over the first 5,000, 36 blocks/s by 56,000). Off here:
# the checks are a debugging aid, never a consensus rule (the index is written the same either way).
checkblockindex=0
checkmempool=0

# Required at start (bitcoind.cpp:140–157; minminingtxfee, the one policy setting refused when absent, :158–164): the block size and the consensus stack-memory value (0 = INT64_MAX,
# configscriptpolicy.cpp:280–282).
excessiveblocksize=4000000000
maxstackmemoryusageconsensus=0

# The policy caps, zeroed = the consensus maxima (consensus.h; docs/PARAMETERS.md §1), as on the consensus instance.
maxscriptsizepolicy=0
maxopsperscriptpolicy=0
maxscriptnumlengthpolicy=0
maxstackmemoryusagepolicy=0
maxtxsizepolicy=0
maxtxsigopscountspolicy=0
maxpubkeyspermultisigpolicy=0

# The funding transactions pay to the entries' own locking scripts, which are anything the corpus holds: no
# standardness gate on this instance (the block path applies none; these keep the mempool road open for the bake's
# own use). Nothing is ever relayed: listen=0.
acceptnonstdtxn=1
acceptnonstdoutputs=1
datacarrier=1
datacarriersize=4294967295

# The validation-duration walls raised as on the consensus instance (config.cpp:682–740, the floors; config.h:344–356 from
# init.cpp:2758, the start-time ordering).
maxstdtxvalidationduration=300000
maxnonstdtxvalidationduration=600000
maxtxnvalidatorasynctasksrunduration=900000

# Mandatory at start (init.cpp:1215); the harness assembles the spend blocks itself and `submitblock`s them, so the
# node's own block assembly and its fee floors never decide a verdict.
minminingtxfee=0.00000100
mindebugrejectionfee=0.00000100

# THE LOG (continue 25, the owner's plan, 2026-09-28: the Studio's disk; the road's two instances wrote 740 MB of bitcoind.log in 40
# minutes): no debug category and no log file. At the pin the file's name is fixed (logging.cpp:13) and there is no
# -debuglogfile; -printtoconsole sends the log to the console instead of the file (init.cpp:1018-1020), and spec-node.sh
# discards that console (stdout to /dev/null, stderr kept in <datadir>/bitcoind.err); debug=0 turns every debug category
# off (init.cpp:2153-2158); shrinkdebugfile trims an old bitcoind.log at start (init.cpp:3349-3354). The runner's and the
# road's verdicts come from the RPC replies, never from the log.
debug=0
printtoconsole=1
shrinkdebugfile=1
