# harness/oracle/bitcoin.conf: the spec's own SV-node instance (bsv-script-lean #27; docs/DESIGN.md §7).
# bitcoin-sv v1.2.3 (6504a3aff65ba97c0f6c80962b033e35ecbfed4b, docs/PROVENANCE.md §1a) on a PRIVATE regtest
# chain that no peer ever sees (CLAUDE.md rule 10): the node exists for the `verifyscript` RPC
# (src/rpc/misc.cpp:509–917), which judges one input of a transaction under an explicit flag word with the
# prevout given inline (`txo`), touching no chain state at all. Started by harness/oracle/spec-node.sh with
# `-regtest -conf=<this> -datadir=<own datadir> -rpcport=<own port> -port=<own port>`: its own datadir and
# ports, never a shared node's (the always-on oracle of the sibling programs on the same host keeps its own).
#
# THE TWO IDEAS. (1) The activation heights are MAINNET's, so a prevout's `txo.height` selects the same UTXO
# era the spec derives for it (`GetProtocolEra(config.GetConfigScriptPolicy(), txo_height)`, misc.cpp:816–825,
# reads these two settings; the spec's `Params.derive` reads chainparams.cpp:18, 23). Every other flag comes
# in the word the runner passes (the spec's own derivation), so the chain's height is never consulted.
# (2) `verifyscript` hard-codes `consensus = false` (misc.cpp:858–859), so the limits it applies are the POLICY
# getters' (interpreter.cpp:2282–2302 → configscriptpolicy.cpp:65–154); every policy setting below is ZEROED:
# the ops, script-size, multisig-key and stack-memory setters store 0 as the consensus maximum (:182, :232, :259,
# :291), the number-length setter stores the 0 and its getter resolves it per era (:211, :97–106), so the numbers
# the RPC applies are the consensus numbers. `consensus` is read nowhere else in the interpreter at the pin
# (the grep on interpreter.cpp: lines 2284–2301 only): DESIGN Q6, answered in harness/oracle/README.md.

regtest=1
server=1
listen=0
dnsseed=0
upnp=0
discover=0
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpcthreads=4
rpcworkqueue=64
rpcservertimeout=600

# The eras: mainnet's activation heights (chainparams.cpp:18 GENESIS_ACTIVATION_MAIN 620538, :23
# CHRONICLE_ACTIVATION_MAIN 943816; regtest's own defaults are 10,000 and 15,000, chainparams.cpp:21, 26).
# With these, a corpus prevout at height h is in the era the spec assigns to h on mainnet.
genesisactivationheight=620538
chronicleactivationheight=943816

# Required at start (bitcoind.cpp:140–157; minminingtxfee, the one policy setting refused when absent, :158–164): the block size and the consensus stack-memory value (0 = INT64_MAX,
# configscriptpolicy.cpp:280–282).
excessiveblocksize=4000000000
maxstackmemoryusageconsensus=0

# The policy caps, zeroed = the consensus maxima (consensus.h; docs/PARAMETERS.md §1): script size UINT32_MAX
# (:60), ops per script UINT32_MAX (:43), number length per era (750,000 B after Genesis :64, 32,000,000 B after
# Chronicle :66), transaction size 1 GB (:29), stack memory INT64_MAX, sigops and multisig keys unlimited.
maxscriptsizepolicy=0
maxopsperscriptpolicy=0
maxscriptnumlengthpolicy=0
maxstackmemoryusagepolicy=0
maxtxsizepolicy=0
maxtxsigopscountspolicy=0
maxpubkeyspermultisigpolicy=0

# Not read by verifyscript (no mempool path is used). They relax the mempool's standardness gate only: an
# accidental submission is still judged under the standard flags plus FORKID, never by consensus alone.
acceptnonstdtxn=1
acceptnonstdoutputs=1
datacarrier=1
datacarriersize=4294967295

# The validation-duration walls cannot be zeroed (config.cpp:682–740: floors of 1 ms and 10 ms; config.h:344–356,
# called from init.cpp:2758: the node refuses std >= nonstd at start). `verifyscript` cancels a script after `maxstdtxvalidationduration`
# (misc.cpp:870–876: the per-script token) and the whole call after its `totalTimeout` argument (:617–629,
# default 100 ms; the runner passes its own, pinned). Raised to five and ten minutes so the oracle measures
# consensus, not a clock; a `timeout` result is `undecided` in the corpus, never a verdict.
maxstdtxvalidationduration=300000
maxnonstdtxvalidationduration=600000
maxtxnvalidatorasynctasksrunduration=900000

# Mandatory at start (init.cpp:1215); no transaction is ever mined or relayed by this instance.
minminingtxfee=0.00000100
mindebugrejectionfee=0.00000100

# THE LOG (continue 25, the owner's plan, 2026-09-28: the Studio's disk; the road's two instances wrote 740 MB of bitcoind.log in 40
# minutes): no debug category and no log file. At the pin the file's name is fixed (logging.cpp:13) and there is no
# -debuglogfile; -printtoconsole sends the log to the console instead of the file (init.cpp:1018-1020), and spec-node.sh
# discards that console (stdout to /dev/null, stderr kept in <datadir>/bitcoind.err); debug=0 turns every debug category
# off (init.cpp:2153-2158); shrinkdebugfile trims an old bitcoind.log at start (init.cpp:3349-3354). The runner's and the
# road's verdicts come from the RPC replies, never from the log.
debug=0
printtoconsole=1
shrinkdebugfile=1
