# harness/oracle/bitcoin-policy.conf: the spec's SECOND SV-node instance, the POLICY instance (bsv-script-lean #27;
# 2026-09-24, the eras corpus's first record run). The same pinned binary and the same idea as bitcoin.conf (mainnet
# activation heights; a private regtest chain no peer ever sees; the verifyscript RPC only), with ONE difference: the
# policy caps are left at the node's DEFAULTS instead of zeroed. bitcoin.conf's zeroed instance applies the consensus
# limits on the policy path (Q6) and is the comparand of the spec's `spec` column; this instance applies the node's
# default mempool limits and is the comparand of the spec's `spec-mempool` column. The first entry that told the two
# apart: eras-00042, a 1,048,577-byte number on a post-Chronicle coin, within 32,000,000 at consensus and over the
# 10,000 policy width. Started by spec-node.sh with `-regtest -conf=<this> -datadir=<its own> -rpcport=18565 -port=18566`.

regtest=1
server=1
listen=0
dnsseed=0
upnp=0
discover=0
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpcthreads=4
rpcworkqueue=64
rpcservertimeout=600

# The eras: mainnet's activation heights (chainparams.cpp:18 GENESIS_ACTIVATION_MAIN 620538, :23
# CHRONICLE_ACTIVATION_MAIN 943816; regtest's own defaults are 10,000 and 15,000, chainparams.cpp:21, 26).
# With these, a corpus prevout at height h is in the era the spec assigns to h on mainnet.
genesisactivationheight=620538
chronicleactivationheight=943816

# regtest's `-checkblockindex`/`-checkmempool` default ON (chainparams.cpp:1526, init.cpp:2204): off, as on the block
# instance whose chain this instance adopts for the tx.* families' mempool road (D97, 2026-09-26).
checkblockindex=0
checkmempool=0

# Required at start (bitcoind.cpp:140–157; minminingtxfee, the one policy setting refused when absent, :158–164): the block size and the consensus stack-memory value (0 = INT64_MAX,
# configscriptpolicy.cpp:280–282).
excessiveblocksize=4000000000
maxstackmemoryusageconsensus=0

# THE POLICY CAPS AT THE NODE'S DEFAULTS: nothing set here, so each cap is the value policy.h gives it (the mempool
# column of docs/PARAMETERS.md §1: maxscriptnumlengthpolicy 10,000 policy.h:156; maxscriptsizepolicy 500,000 :93;
# maxopsperscriptpolicy UINT32_MAX :147; maxpubkeyspermultisigpolicy UINT32_MAX :150; maxstackmemoryusagepolicy
# 100,000,000; the transaction and sigops caps as policy.h has them). `verifyscript` applies them on its policy path
# (consensus = false, misc.cpp:858–859), so this instance's verdict is the node's MEMPOOL verdict on the script: the
# comparand of the spec's spec-mempool column (Params.derive with consensus = false, SV-node's mainnet defaults).
# The runner reads every cap back through getsettings and records it beside the verdicts (run_svnode.rs).

# THE MEMPOOL ROAD'S STANDARDNESS, AT MAINNET'S DEFAULT (D123, the owner's plan's continue 10, 2026-09-27: "the spec's
# `spec-mempool` column models what a DEFAULT reference node's mempool accepts (`requireStandard` true on mainnet, the caps
# live) ... the policy instance runs at the default and produces the column's rows"). `verifyscript` never reads these (no
# mempool path, misc.cpp:858–859); the block road's `sendrawtransaction` does (D97, 2026-09-26: this instance adopts the
# block instance's chain for the tx.* families' mempool column, txroad.rs).
# - requireStandard: mainnet's default is TRUE (chainparams.cpp:1121; regtest's own default is false, :1527), read as
#   `!acceptnonstdtxn` at init.cpp:3001–3003, so this regtest instance sets acceptnonstdtxn=0. Its effect after Genesis:
#   a transaction IsStandardTx refuses (script/standard.cpp:427–500) is rejected unless the only reason is "scriptpubkey"
#   (validation.cpp:1082–1089). After Chronicle, IsStandardTx checks the transaction's size (GetMaxTxSize(era, false),
#   the policy cap), every output's type (IsStandardOutput at :472; a non-standard type returns "scriptpubkey", :493–496),
#   bare multisig, dust and the data carrier size (the version and push-only checks stop at Chronicle, :431–439,
#   :462–465).
# - acceptnonstdoutputs: the default, TRUE after Genesis (configscriptpolicy.cpp:60, :468–471), so AreInputsStandard is
#   not the bad-txns-nonstandard-inputs gate after Genesis (that branch, validation.cpp:1207–1224, runs only when it is
#   false); it still runs under the node's limits for a transaction not of low priority (1226–1234), as a probe whose
#   failure is refused as too-long-validation-time.
# - datacarrier and datacarriersize: their defaults, true and UINT32_MAX (script/standard.h:20, :46).
acceptnonstdtxn=0
acceptnonstdoutputs=1
datacarrier=1
datacarriersize=4294967295

# The validation-duration walls cannot be zeroed (config.cpp:682–740: floors of 1 ms and 10 ms; config.h:344–356,
# called from init.cpp:2758: the node refuses std >= nonstd at start). `verifyscript` cancels a script after `maxstdtxvalidationduration`
# (misc.cpp:870–876: the per-script token) and the whole call after its `totalTimeout` argument (:617–629,
# default 100 ms; the runner passes its own, pinned). Raised to five and ten minutes so the oracle measures
# consensus, not a clock; a `timeout` result is `undecided` in the corpus, never a verdict.
maxstdtxvalidationduration=300000
maxnonstdtxvalidationduration=600000
maxtxnvalidatorasynctasksrunduration=900000

# Mandatory at start (init.cpp:1215); no transaction is ever mined or relayed by this instance.
minminingtxfee=0.00000100
mindebugrejectionfee=0.00000100

# THE LOG (continue 25, the owner's plan, 2026-09-28: the Studio's disk; the road's two instances wrote 740 MB of bitcoind.log in 40
# minutes): no debug category and no log file. At the pin the file's name is fixed (logging.cpp:13) and there is no
# -debuglogfile; -printtoconsole sends the log to the console instead of the file (init.cpp:1018-1020), and spec-node.sh
# discards that console (stdout to /dev/null, stderr kept in <datadir>/bitcoind.err); debug=0 turns every debug category
# off (init.cpp:2153-2158); shrinkdebugfile trims an old bitcoind.log at start (init.cpp:3349-3354). The runner's and the
# road's verdicts come from the RPC replies, never from the log.
debug=0
printtoconsole=1
shrinkdebugfile=1
