# Local execution settings, no consensus or policy overrides.
# [SRC] Teranode v0.16.0 at 4edb60a40c6628ff0ef60231c2628efd7103fde5.
# The script supplies DATADIR as ~/bsv/targets/spec-teranode/data.
# [SRC] settings.conf:1010; settings/settings.go:49; util/sql.go:222-232.
network.test = regtest
dataFolder.test = ${DATADIR}

# [SRC] daemon/test_daemon.go:428; services/blockchain/Server.go:402-410.
# The tagged test daemon starts in RUNNING; an offline IDLE node waits for peers.
local_test_start_from_state.test = RUNNING

# [SRC] settings.conf:809,1230: replace wildcard health and profiler bindings.
health_check_httpListenAddress.test = 127.0.0.1:${HEALTH_CHECK_PORT}
profilerAddr.test = 127.0.0.1:${PROFILE_PORT}

# [SRC] settings.conf:205-235: asset HTTP, centrifuge and local proxy.
# [SRC] daemon/test_daemon.go:426: the test daemon disables subscriptions.
# Its websocket client requires the p2p service, which is off in this sitting.
asset_centrifuge_disable.test = true
asset_centrifugeListenAddress.test = 127.0.0.1:${CENTRIFUGE_PORT}
asset_httpListenAddress.test = 127.0.0.1:${ASSET_HTTP_PORT}
asset_httpAddress.test = http://127.0.0.1:${ASSET_HTTP_PORT}${asset_apiPrefix}
asset_propagation_proxy_address.test = http://127.0.0.1:${PROPAGATION_HTTP_PORT}

# [SRC] settings.conf:304-311,428-440,522-527,1471-1476.
blockassembly_grpcAddress.test = 127.0.0.1:${BLOCK_ASSEMBLY_GRPC_PORT}
blockassembly_grpcListenAddress.test = 127.0.0.1:${BLOCK_ASSEMBLY_GRPC_PORT}
blockchain_grpcAddress.test = 127.0.0.1:${BLOCKCHAIN_GRPC_PORT}
blockchain_grpcListenAddress.test = 127.0.0.1:${BLOCKCHAIN_GRPC_PORT}
blockchain_httpListenAddress.test = 127.0.0.1:${BLOCKCHAIN_HTTP_PORT}
blockvalidation_grpcAddress.test = 127.0.0.1:${BLOCK_VALIDATION_GRPC_PORT}
blockvalidation_grpcListenAddress.test = 127.0.0.1:${BLOCK_VALIDATION_GRPC_PORT}
subtreevalidation_grpcAddress.test = 127.0.0.1:${SUBTREE_VALIDATION_GRPC_PORT}
subtreevalidation_grpcListenAddress.test = 127.0.0.1:${SUBTREE_VALIDATION_GRPC_PORT}

# [SRC] settings.conf:1242-1263: propagation clients and listeners.
propagation_grpcAddresses.test = 127.0.0.1:${PROPAGATION_GRPC_PORT}
propagation_grpcListenAddress.test = 127.0.0.1:${PROPAGATION_GRPC_PORT}
propagation_httpAddresses.test = http://127.0.0.1:${PROPAGATION_HTTP_PORT}
propagation_httpListenAddress.test = 127.0.0.1:${PROPAGATION_HTTP_PORT}

# [SRC] settings.conf:1273-1280: RPC credentials and listener.
rpc_listener_url.test = http://127.0.0.1:${TERANODE_RPC_PORT}
rpc_user.test = bitcoin
rpc_pass.test = bitcoin

# [SRC] settings.conf:1100-1101,897-902,1703-1716: optional clients stay local.
# Their services remain off through -all=0 and the script's explicit off flags.
p2p_grpcAddress.test = 127.0.0.1:${P2P_GRPC_PORT}
# [SRC] settings.conf:1123-1124: optional websocket client stays local.
p2p_httpAddress.test = 127.0.0.1:${P2P_HTTP_PORT}
legacy_grpcAddress.test = 127.0.0.1:${LEGACY_GRPC_PORT}
validator_grpcAddress.test = 127.0.0.1:${VALIDATOR_GRPC_PORT}
# [SRC] settings.conf:1709-1716; services/validator/Server.go:478-487.
# Enabled only by instance.py start --validator for the native block-context API.
validator_grpcListenAddress.test = 127.0.0.1:${VALIDATOR_GRPC_PORT}
validator_httpListenAddress.test = 127.0.0.1:${VALIDATOR_HTTP_PORT}

# [SRC] settings/settings.go:45,69: no tracing or Datadog profiler.
tracing_enabled.test = false
use_datadog_profiler.test = false
