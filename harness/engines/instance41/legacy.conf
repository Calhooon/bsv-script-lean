# The second recipe of the instance of #41 (#66 cut 2, lane cut2-66, [D] 2026-10-15):
# the legacy P2P bridge ON, every listener on 127.0.0.1, p2p and alert still off.
# instance.py start --legacy appends this file to settings_local.conf in data/runtime;
# without --legacy nothing here is read and the recipe of record is unchanged.
# [SRC] Teranode v0.16.0 at 4edb60a40c6628ff0ef60231c2628efd7103fde5.

# [SRC] settings/legacy_settings.go:11; services/legacy/Server.go:402-406 (the
# listener list; empty falls back to the outbound IP on the network's port, so it
# is never left empty here). 18590 sits in the harness peer's reserved range
# (harness/peer/peer.py's connect guard, 18571 to 18590).
LEGACY_P2P_PORT = 18590
legacy_listen_addresses.test = 127.0.0.1:${LEGACY_P2P_PORT}

# [SRC] settings.conf:901 binds the legacy gRPC listener on every interface
# (":${LEGACY_GRPC_PORT}"); it is pinned to the loopback here (the client address
# legacy_grpcAddress.test is already loopback in settings_local.conf). The
# legacy_http* keys of settings.conf:904-911 are read by no field of
# settings/legacy_settings.go at the tag, and the service opens no HTTP listener
# ([M] 2026-10-15T03:30Z, the probe's log: 127.0.0.1:8099 and 127.0.0.1:18590 only).
legacy_grpcListenAddress.test = 127.0.0.1:${LEGACY_GRPC_PORT}

# No outbound peer of any kind: no configured peers (settings/legacy_settings.go:12),
# no automatic outbound target (services/legacy/peer_server.go:3046-3056, a target
# of 0), no DNS seeding (services/legacy/config.go:171; peer_server.go:3279) and no
# feeler probes (settings/legacy_settings.go:30, 0 disables them). The address
# manager is not saved (legacy_savePeers default false, :25).
legacy_connect_peers.test =
# The two legacy_config_ keys are read without a context (services/legacy/config.go:812-850;
# the fields at :171 and :207, the default target 8 at :64).
legacy_config_TargetOutboundPeers = 0
legacy_config_DisableDNSSeed = true
legacy_maxFeelerPeers.test = 0

# The ban score is the bridge's peer management, not a validation rule: with banning
# on, a rejected block or a misbehaving frame from the one loopback peer would ban
# 127.0.0.1 and end the run's road ([SRC] services/legacy/peer_server.go:715 (the ban
# score), :805 (the user-agent gate), :1926; the field at services/legacy/config.go:166).
legacy_config_DisableBanning = true
